spring.application.name=flipo-backend

# PostgreSQL. Defaults target the local docker-compose stack; override via env vars in other
# environments (Neon/Railway in production).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flipo}
spring.datasource.username=${DB_USER:flipo}
spring.datasource.password=${DB_PASSWORD:flipo_dev_password}

# Schema is owned by Flyway migrations (docs/02-modelo-de-dados.md), never by Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
