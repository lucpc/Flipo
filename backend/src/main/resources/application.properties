spring.application.name=flipo-backend

# PostgreSQL. Defaults target the local docker-compose stack; override via env vars in other
# environments (Neon/Railway in production).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flipo}
spring.datasource.username=${DB_USER:flipo}
spring.datasource.password=${DB_PASSWORD:flipo_dev_password}

# Schema is owned by Flyway migrations (docs/02-modelo-de-dados.md), never by Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# JWT (docs/04-arquitetura-tecnica.md, seção Segurança). Override via env var in other
# environments — this default is only good enough for local development.
flipo.jwt.secret=${JWT_SECRET:desenvolvimento-apenas-troque-este-segredo-antes-de-ir-para-producao-0123456789}
flipo.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Authentication is entirely JWT-based (see SecurityConfig) — no form login/HTTP Basic, so the
# auto-generated in-memory user Spring Boot would otherwise create (and log a random password
# for) is unused noise. Disabling it here avoids any confusion about a second, unintended auth
# path.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
