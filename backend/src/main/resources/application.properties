spring.application.name=flipo-backend

# PostgreSQL. Defaults target the local docker-compose stack; override via env vars in other
# environments (Neon/Railway in production).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flipo}
spring.datasource.username=${DB_USER:flipo}
spring.datasource.password=${DB_PASSWORD:flipo_dev_password}

# Schema is owned by Flyway migrations (docs/02-modelo-de-dados.md), never by Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# No open-in-view: with it on, a request that touched the database keeps its connection until the
# response is written, including during the slow AI call in gerar-ia (GeracaoDeCartoesService).
# Controllers only map fields already loaded by the services, never lazy associations.
spring.jpa.open-in-view=false

# JWT (docs/04-arquitetura-tecnica.md, seção Segurança). Override via env var in other
# environments — this default is only good enough for local development.
flipo.jwt.secret=${JWT_SECRET:desenvolvimento-apenas-troque-este-segredo-antes-de-ir-para-producao-0123456789}
flipo.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS (see SecurityConfig): origins allowed to call the API from a browser, i.e. the web build of
# the app. Comma-separated origin patterns. The default covers `flutter run -d chrome`, which picks
# a random localhost port: `[*]` is Spring's port-only wildcard, so unlike a bare `*` it does not
# match lookalikes such as http://localhost:1@evil.com. The port-list form `[8080,3000]` can't
# be used here (the comma split breaks it): use `[*]` or a single port. In production set
# CORS_ALLOWED_ORIGIN_PATTERNS to the exact web deploy domain (e.g. https://flipo.vercel.app),
# never a host wildcard like https://*.vercel.app, which would accept any site hosted there.
flipo.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:[*]}

# Authentication is entirely JWT-based (see SecurityConfig) — no form login/HTTP Basic, so the
# auto-generated in-memory user Spring Boot would otherwise create (and log a random password
# for) is unused noise. Disabling it here avoids any confusion about a second, unintended auth
# path.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Geração de cartões por IA (docs/04-arquitetura-tecnica.md, "Estratégia de IA"). Sem chave, não há
# gerador e o gerar-ia responde 503 (GeradorAnthropicConfig). A chave nunca vai para log nem resposta.
flipo.ia.anthropic.api-key=${ANTHROPIC_API_KEY:}
flipo.ia.anthropic.modelo=${ANTHROPIC_MODEL:claude-haiku-5-5}
