# Somado ao application.properties principal (config/ tem precedência sobre a raiz do classpath).
# Fixa a chave da Anthropic vazia nos testes: com ANTHROPIC_API_KEY exportada no ambiente, o
# GeradorAnthropic entraria no contexto, chamaria a API real e mudaria o comportamento dos testes
# (o 503 sem gerador, o GeradorDeCartoesFake como único gerador).
flipo.ia.anthropic.api-key=

# Heap menor no processo filho da extração de PDF: os PDFs que esgotam a memória chegam lá mais rápido
# (uns 2 s em vez de 7 s com o ToUnicode hostil). Ainda cabe um PDF válido de 10 MB.
flipo.pdf.processo.heap=128m
