# Frontend CI — analyze, test and build (web) the Flutter app under /app.

name: Frontend CI

on:
  # No path filter on pull_request: this workflow's job name is a required
  # status check on main. A path-filtered pull_request trigger means PRs
  # that don't touch app/ never produce this check, and GitHub blocks
  # merge forever waiting on a required check that will never report.
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: flutter build web
        run: flutter build web
