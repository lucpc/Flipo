# Frontend CI — lint and build the Vite/React app under /frontend.

name: Frontend CI

on:
  # No path filter on pull_request: this workflow's job name is a required
  # status check on main. A path-filtered pull_request trigger means PRs
  # that don't touch frontend/ never produce this check, and GitHub blocks
  # merge forever waiting on a required check that will never report.
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build
